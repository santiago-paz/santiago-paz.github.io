<!doctype html>
<!--
  The project was renamed SplitBerlin → Contract Lens to match the CV and the
  repository. GitHub Pages has no redirect layer, so this stub preserves the
  old indexed URL: `canonical` moves the ranking, `refresh` moves the visitor.

  No `noindex` here, deliberately. Google ignores the canonical on a page it has
  been told not to index — it drops that page instead of folding it into the
  target — so `noindex` would strand whatever the old URL earned rather than
  hand it to Contract Lens. A zero-second `refresh` already reads as a redirect.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contract Lens - Santiago Paz</title>
    <link rel="canonical" href="https://santiagopaz.com/projects/contract-lens/" />
    <meta http-equiv="refresh" content="0; url=/projects/contract-lens/" />
  </head>
  <body>
    <p>
      This project is now called Contract Lens.
      <a href="/projects/contract-lens/">Continue to Contract Lens</a>.
    </p>
  </body>
</html>
